<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study</title>
<style>
:root{--bg:#f4f3ff;--sf:#fff;--sf2:#edebff;--tx:#1c1845;--mu:#6e6b9a;--bd:#e3e0fa;--pr:#6c5ce7;--pr2:#4834d4;--ac:#00b894;--wm:#ff7a59;--sh:0 8px 24px rgba(76,60,200,.10);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d1f;--sf:#1a1839;--sf2:#252250;--tx:#f1f0ff;--mu:#9f9dcc;--bd:#2d2a5c;--pr:#8b7dff;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0e0d1f;--sf:#1a1839;--sf2:#252250;--tx:#f1f0ff;--mu:#9f9dcc;--bd:#2d2a5c;--pr:#8b7dff;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--tx);line-height:1.5;padding-top:env(safe-area-inset-top,0px)}
.app{max-width:560px;margin:0 auto;padding:0 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 12px}
.hi{font-size:13px;color:var(--mu)}
h1{font-size:24px;letter-spacing:-.5px}
h2{font-size:17px;letter-spacing:-.2px}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:18px;cursor:pointer;box-shadow:var(--sh)}
.pg{display:none;animation:in .3s ease}.pg.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#6c5ce7,#4834d4 60%,#341f97);color:#fff;border:0;display:flex;align-items:center;gap:16px}
.hero p{opacity:.85;font-size:13px}.hero h2{font-size:20px;margin:2px 0 8px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.18)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--sh)}
.st b{display:block;font-size:22px;color:var(--pr)}.st span{font-size:11px;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 12px}
.sub{font-size:13px;color:var(--mu)}
.btn{border:0;border-radius:14px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;box-shadow:0 6px 16px rgba(108,92,231,.35)}
.btn.g{background:var(--sf2);color:var(--tx);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:13px}
.bar{height:8px;background:var(--sf2);border-radius:9px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--pr));border-radius:9px;transition:width .5s}
.item{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:13px 14px;margin-bottom:10px}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--bd);background:none;cursor:pointer;flex:none;color:#fff;font-size:15px;line-height:1}
.chk.on{background:var(--ac);border-color:var(--ac)}
.item.done .tt{text-decoration:line-through;color:var(--mu)}
.tt{font-weight:600;font-size:15px}.grow{flex:1;min-width:0}
.x{background:none;border:0;color:var(--mu);font-size:22px;cursor:pointer;padding:0 4px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,hsl(var(--h,255) 70% 55%) 18%,transparent);color:color-mix(in srgb,hsl(var(--h,255) 70% 50%) 80%,var(--tx))}
.note{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.note h3{font-size:16px;margin:8px 0 4px}.note p{font-size:14px;color:var(--mu);white-space:pre-wrap;word-break:break-word}
.empty{text-align:center;color:var(--mu);padding:34px 10px;font-size:14px;border:1.5px dashed var(--bd);border-radius:18px}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px;outline:0;margin-bottom:10px}
input:focus,textarea:focus,select:focus{border-color:var(--pr)}
textarea{min-height:100px;resize:vertical}
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--sf) 92%,transparent);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20;backdrop-filter:blur(12px)}
.tabs div{display:flex;width:100%;max-width:560px}
.tab{flex:1;background:none;border:0;color:var(--mu);font-size:11px;font-weight:600;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:14px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--pr);background:var(--sf2)}
.sb{display:none;position:fixed;inset:0;background:rgba(10,8,40,.5);z-index:50;align-items:flex-end}
.sb.on{display:flex}
.sheet{background:var(--sf);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;animation:in .25s}
.sheet h2{margin-bottom:14px}
.err{color:#e5484d;font-size:13px;min-height:18px;margin-bottom:6px}
.acts{display:flex;gap:10px}.acts .btn{flex:1}
.opt{display:block;width:100%;text-align:left;padding:14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--tx);font:inherit;font-size:15px;margin-bottom:10px;cursor:pointer}
.opt.ok{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,var(--sf))}
.opt.no{border-color:#e5484d;background:color-mix(in srgb,#e5484d 14%,var(--sf))}
.big{font-size:48px;font-weight:800;text-align:center;color:var(--pr);margin:10px 0}
.pre{border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:99px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer}.pre.on{background:var(--pr);border-color:var(--pr);color:#fff}
.ft{text-align:center;font-size:12px;color:var(--mu);padding:18px 0 4px}

body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 40% at 92% -5%,color-mix(in srgb,var(--pr) 30%,transparent),transparent 70%),radial-gradient(50% 35% at -10% 32%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 70%)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--pr),var(--ac));box-shadow:0 8px 20px rgba(108,92,231,.4)}
h1{font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
h2{font-weight:700}
.card{border-radius:24px}
.hero{position:relative;overflow:hidden;padding:22px;border-radius:28px;box-shadow:0 18px 40px rgba(72,52,212,.38);background:linear-gradient(135deg,#7c6cf0 0%,#5a45e0 55%,#1fa39a 140%)}
.hero>*{position:relative;z-index:1}
.orb{position:absolute!important;z-index:0!important;border-radius:50%;background:rgba(255,255,255,.12)}
.o1{width:180px;height:180px;right:-55px;top:-65px}.o2{width:110px;height:110px;right:50px;bottom:-60px;background:rgba(255,255,255,.08)}
.hero h2{font-size:21px;margin:2px 0 4px}.mt{font-size:13px;opacity:.92;margin-bottom:12px}
.ring b{font-weight:800}
.pill{background:rgba(255,255,255,.2);backdrop-filter:blur(6px)}
.st{padding:14px 6px;border-radius:20px}
.st .si{font-style:normal;font-size:20px;display:block;margin-bottom:2px}
.st b{font-size:24px;font-weight:800}
.st:nth-child(1){background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 18%,var(--sf)),var(--sf))}
.st:nth-child(2){background:linear-gradient(160deg,color-mix(in srgb,var(--pr) 18%,var(--sf)),var(--sf))}
.st:nth-child(3){background:linear-gradient(160deg,color-mix(in srgb,var(--wm) 18%,var(--sf)),var(--sf))}
.item{border-radius:18px;box-shadow:var(--sh);border-left:4px solid var(--pr);transition:transform .15s,opacity .2s}
.item.done{border-left-color:var(--ac);opacity:.8}.item:active{transform:scale(.99)}
.chk{transition:.2s}.chk.on{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.28)}}
.btn{transition:transform .15s}.btn:active{transform:scale(.96)}
.pg>*{animation:in .45s both}.pg>*:nth-child(2){animation-delay:.06s}.pg>*:nth-child(3){animation-delay:.12s}.pg>*:nth-child(4){animation-delay:.18s}
.empty{background:color-mix(in srgb,var(--pr) 6%,transparent)}
.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;padding:6px;border:1px solid var(--bd);border-radius:26px;box-shadow:0 14px 34px rgba(40,30,120,.25)}
.tab{border-radius:20px;padding:9px 0;transition:.2s}
.tab.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;box-shadow:0 6px 14px rgba(108,92,231,.4)}
#fr{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--pr) 55%,transparent))}
.pre.on{box-shadow:0 6px 14px rgba(108,92,231,.35)}
.ft{padding:22px 0 6px;font-weight:600;letter-spacing:.3px}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:600;font-size:14px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.3);white-space:nowrap;animation:ti .3s}
@keyframes ti{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo">&#128218;</span><div><p class="hi" id="hi"></p><h1>Study</h1></div></div>
    <button class="ib" id="th" aria-label="Switch theme">&#9790;</button>
  </header>

  <section class="pg on" id="home">
    <div class="card hero"><span class="orb o1"></span><span class="orb o2"></span>
      <div class="ring"><svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="9"/><circle id="rg" cx="52" cy="52" r="44" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5" style="transition:stroke-dashoffset .8s"/></svg><b id="pc">0%</b></div>
      <div><p>Today's target</p><h2 id="hh">No targets yet</h2><p class="mt" id="mt"></p><span class="pill" id="sk">0 day streak</span></div>
    </div>
    <div class="stats">
      <div class="st"><i class="si">&#9989;</i><b id="s1">0</b><span>Done in total</span></div>
      <div class="st"><i class="si">&#9201;&#65039;</i><b id="s2">0</b><span>Focus min today</span></div>
      <div class="st"><i class="si">&#127919;</i><b id="s3">0</b><span>Sessions total</span></div>
    </div>
    <div class="card">
      <div class="row" style="margin:0 0 4px"><h2>Study growth</h2><span class="sub">Last 15 days</span></div>
      <p class="sub" id="gs" style="margin-bottom:8px"></p>
      <div id="chart"></div>
    </div>
    <button class="btn" style="width:100%" onclick="go('targets');addTarget()">+ Set today's target</button>
  </section>

  <section class="pg" id="targets">
    <div class="row"><div><h2>Today's targets</h2><p class="sub" id="td"></p></div><button class="btn sm" onclick="addTarget()">+ Add</button></div>
    <div class="bar"><i id="tb" style="width:0"></i></div>
    <div id="tl"></div>
  </section>

  <section class="pg" id="focus">
    <div class="row"><div><h2>Focus</h2><p class="sub">Deep-work sessions, zero distractions</p></div></div>
    <div class="card" style="text-align:center">
      <div class="ring" style="width:220px;height:220px;margin:6px auto 18px"><svg width="220" height="220" viewBox="0 0 220 220"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c5ce7"/><stop offset="1" stop-color="#00b894"/></linearGradient></defs><circle cx="110" cy="110" r="96" fill="none" stroke="var(--sf2)" stroke-width="12"/><circle id="fr" cx="110" cy="110" r="96" fill="none" stroke="url(#fg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="603.2" stroke-dashoffset="603.2" style="transition:stroke-dashoffset .5s linear"/></svg><b id="ft" style="font-size:46px;font-variant-numeric:tabular-nums">25:00</b></div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px">
        <button class="pre" data-m="15" onclick="setF(15)">15 min</button><button class="pre" data-m="25" onclick="setF(25)">25 min</button><button class="pre" data-m="45" onclick="setF(45)">45 min</button><button class="pre" data-m="60" onclick="setF(60)">60 min</button>
      </div>
      <div class="acts"><button class="btn g" onclick="resetF()">Reset</button><button class="btn" id="fb" onclick="toggleF()">Start</button></div>
      <p class="sub" id="fmsg" style="margin-top:12px;min-height:20px"></p>
    </div>
    <div class="card" style="display:flex;justify-content:space-around;text-align:center">
      <div><b style="font-size:24px;color:var(--pr)" id="fm">0</b><div class="sub">Minutes today</div></div>
      <div><b style="font-size:24px;color:var(--ac)" id="fn">0</b><div class="sub">Sessions today</div></div>
    </div>
  </section>

  <footer class="ft">Created by Madan</footer>
</div>

<nav class="tabs"><div>
  <button class="tab on" data-p="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button class="tab" data-p="targets"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg>Targets</button>
  <button class="tab" data-p="focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>Focus</button>
</div></nav>

<div class="sb" id="sb"><div class="sheet" id="sheet"></div></div>

<script>
var K='studyspace_v2',S={targets:[],focus:[]};
try{var r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dk(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}

var th=null;try{th=localStorage.getItem('ss_theme')}catch(e){}
if(th)document.documentElement.setAttribute('data-theme',th);
$('#th').onclick=function(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);
  var n=dark?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('ss_theme',n)}catch(e){}
};

function go(p){
  document.querySelectorAll('.pg').forEach(function(e){e.classList.toggle('on',e.id===p)});
  document.querySelectorAll('.tab').forEach(function(e){e.classList.toggle('on',e.dataset.p===p)});
  window.scrollTo(0,0);render();
}
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){go(t.dataset.p)}});

function openSheet(title,body,onSave,label){
  $('#sheet').innerHTML='<h2>'+title+'</h2>'+body+'<div class="err" id="er"></div><div class="acts"><button class="btn g" id="cx">Cancel</button><button class="btn" id="sv">'+(label||'Save')+'</button></div>';
  $('#sb').classList.add('on');
  $('#cx').onclick=closeSheet;
  $('#sv').onclick=function(){var e=onSave();if(e)$('#er').textContent=e;else closeSheet()};
}
function closeSheet(){$('#sb').classList.remove('on')}
$('#sb').onclick=function(e){if(e.target===this)closeSheet()};

function todays(){var t=dk();return S.targets.filter(function(x){return x.on===t})}
function doneOn(d){return S.targets.filter(function(x){return x.done===d}).length}
function streak(){
  var d=new Date(),n=0;
  if(!doneOn(dk(d)))d.setDate(d.getDate()-1);
  while(doneOn(dk(d))>0){n++;d.setDate(d.getDate()-1)}
  return n;
}

function chart(){
  var W=320,H=150,L=10,B=26,T=16,N=15,days=[],cum=[],i,d;
  for(i=N-1;i>=0;i--){d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  days.forEach(function(d){var k=dk(d);cum.push(S.targets.filter(function(x){return x.done&&x.done<=k}).length)});
  var max=Math.max(cum[N-1],4),xs=[],ys=[];
  for(i=0;i<N;i++){xs.push(L+i*(W-2*L)/(N-1));ys.push(H-B-(cum[i]/max)*(H-B-T))}
  var p='M'+xs[0]+' '+ys[0];
  for(i=1;i<N;i++){var cx=(xs[i-1]+xs[i])/2;p+=' C'+cx+' '+ys[i-1]+' '+cx+' '+ys[i]+' '+xs[i]+' '+ys[i]}
  var base=H-B,a=p+' L'+xs[N-1]+' '+base+' L'+xs[0]+' '+base+' Z';
  var g='';[0,.5,1].forEach(function(f){var y=base-f*(base-T);g+='<line x1="'+L+'" x2="'+(W-L)+'" y1="'+y+'" y2="'+y+'" stroke="var(--bd)" stroke-dasharray="3 4"/>'});
  var lb='';[0,7,14].forEach(function(j){lb+='<text x="'+xs[j]+'" y="'+(H-6)+'" text-anchor="'+(j===0?'start':j===14?'end':'middle')+'" font-size="11" fill="var(--mu)">'+days[j].toLocaleDateString('en',{month:'short',day:'numeric'})+'</text>'});
  var dots='';for(i=0;i<N;i++){if(i>0&&cum[i]===cum[i-1]&&i!==N-1)continue;dots+='<circle cx="'+xs[i]+'" cy="'+ys[i]+'" r="'+(i===N-1?5:3)+'" fill="'+(i===N-1?'var(--pr)':'var(--sf)')+'" stroke="var(--pr)" stroke-width="2"/>'}
  $('#chart').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Cumulative completed targets over the last 15 days"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c5ce7" stop-opacity=".45"/><stop offset="1" stop-color="#00b894" stop-opacity="0"/></linearGradient></defs>'+g+'<path d="'+a+'" fill="url(#gr)"/><path d="'+p+'" fill="none" stroke="var(--pr)" stroke-width="3" stroke-linecap="round"/>'+dots+lb+'</svg>';
  var tot=cum[N-1];
  $('#gs').textContent=tot?tot+' target'+(tot>1?'s':'')+' completed so far. Keep ticking them off to grow the line.':'Complete your daily targets and watch this line climb.';
}
function renderTargets(){
  var t=todays(),dn=t.filter(function(x){return x.done}).length;
  $('#td').textContent=new Date().toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'});
  $('#tb').style.width=(t.length?dn/t.length*100:0)+'%';
  $('#tl').innerHTML=t.length?t.map(function(x){
    return '<div class="item'+(x.done?' done':'')+'"><button class="chk'+(x.done?' on':'')+'" onclick="tick(\''+x.id+'\')" aria-label="Mark done">'+(x.done?'&#10003;':'')+'</button><div class="grow"><div class="tt">'+esc(x.t)+'</div><div style="margin-top:4px">'+(x.sub?'<span class="chip" style="--h:'+hue(x.sub)+'">'+esc(x.sub)+'</span> ':'')+(x.min?'<span class="sub">'+x.min+' min</span>':'')+'</div></div><button class="x" onclick="delT(\''+x.id+'\')" aria-label="Delete">&times;</button></div>'
  }).join(''):'<div class="empty">Plan your day. Add a target and tick it off to grow your graph.</div>';
}
function tick(id){var w=0;S.targets.forEach(function(x){if(x.id===id){x.done=x.done?null:dk();w=x.done?1:0}});save();render();var t=todays();if(w&&t.length&&t.every(function(x){return x.done}))celebrate()}
function toast(m){var e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},2600)}
function celebrate(){toast('Daily target complete! 🎉');var c=['#6c5ce7','#00b894','#ff7a59','#fdcb6e','#74b9ff'];for(var i=0;i<36;i++){var e=document.createElement('i');e.className='cf';e.style.cssText='left:'+Math.random()*100+'vw;background:'+c[i%5]+';animation-delay:'+Math.random()*.4+'s';document.body.appendChild(e);setTimeout(function(n){return function(){n.remove()}}(e),2400)}}
function delT(id){S.targets=S.targets.filter(function(x){return x.id!==id});save();render()}
function addTarget(){
  openSheet('New target','<input id="a1" placeholder="What will you study?"><input id="a2" placeholder="Subject (optional)"><input id="a3" type="number" inputmode="numeric" placeholder="Minutes (optional)">',function(){
    var t=$('#a1').value.trim();if(!t)return 'Enter a target first.';
    S.targets.push({id:uid(),t:t,sub:$('#a2').value.trim(),min:+$('#a3').value||0,on:dk(),done:null});save();render();
  },'Add target');
}

var F={min:25,left:1500,end:0,run:false,iv:null};
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderFocus(){
  var tot=F.min*60;
  $('#fr').style.strokeDashoffset=603.2*(1-(tot-F.left)/tot);
  $('#ft').textContent=fmt(F.left);
  $('#fb').textContent=F.run?'Pause':(F.left<tot?'Resume':'Start');
  document.querySelectorAll('.pre').forEach(function(e){e.classList.toggle('on',+e.dataset.m===F.min)});
  var t=S.focus.filter(function(x){return x.on===dk()});
  $('#fm').textContent=t.reduce(function(a,x){return a+x.min},0);
  $('#fn').textContent=t.length;
}
function tickF(){F.left=Math.max(0,Math.round((F.end-Date.now())/1000));if(F.left<=0)finishF();renderFocus()}
function toggleF(){
  if(F.run){clearInterval(F.iv);F.run=false}
  else{F.end=Date.now()+F.left*1000;F.run=true;F.iv=setInterval(tickF,500);$('#fmsg').textContent=''}
  renderFocus();
}
function finishF(){
  clearInterval(F.iv);F.run=false;S.focus.push({on:dk(),min:F.min});save();F.left=F.min*60;
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  $('#fmsg').textContent='Session complete! Take a short break.';toast('Focus session complete ✨');renderHome();
}
function setF(m){if(F.run)return;F.min=m;F.left=m*60;$('#fmsg').textContent='';renderFocus()}
function resetF(){clearInterval(F.iv);F.run=false;F.left=F.min*60;renderFocus()}

function render(){renderHome();renderTargets();renderFocus()}
render();
</script>
</body>
</html>
